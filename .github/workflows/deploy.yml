# GitHub Pages 部署：push 即构建 dist/ 并发布（开源站点主部署通道）。
# 站点基址默认自动推导为 https://<owner>.github.io/<repo>/；
# 绑定自定义域名时在仓库 Settings → Secrets and variables → Actions → Variables
# 新增变量 SITE_ORIGIN（如 https://www.example.com/）即可覆盖。
# 全部 action 均为 40 位 SHA pinning（与 ci.yml/links.yml 同一纪律）。
name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Build static site
        shell: bash
        env:
          SITE_ORIGIN_VAR: ${{ vars.SITE_ORIGIN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$SITE_ORIGIN_VAR" ]; then
            ORIGIN="$SITE_ORIGIN_VAR"
          else
            REPO_NAME="${REPO#*/}"
            ORIGIN="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          fi
          echo "SITE_ORIGIN=$ORIGIN"
          SITE_ORIGIN="$ORIGIN" node tools/build-site.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
